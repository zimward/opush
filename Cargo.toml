[package]
name = "opush"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
async-signal = "0.2"
base64 = "0.23"
futures-util = { version = "0.3", features = ["sink"] }
rustls = "0.23"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.30", features = ["rustls","rustls-native-certs","rustls-tls-native-roots"] }
tracing = "0.1"
tracing-subscriber = {version="0.3", features=["env-filter"]}
uuid = {version = "1.26", features = ["serde", "v4"]}
zbus = { version = "5", default-features = false, features = ["tokio"] }

[profile.release]
lto = true
strip = true
